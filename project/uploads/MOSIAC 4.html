<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MOSIAC — The Home for Your Cultural Identity</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            mosiac: {
              bg: '#FAF6EE',         /* Reference Cream/Ivory */
              card: '#FFFFFF',       /* Crisp white cards */
              plum: '#5A2330',       /* Primary rich plum/burgundy */
              plumLight: '#F4EBEB',  /* Light blush plum tint */
              teal: '#1E3A36',       /* Splash Forest Teal */
              tealDark: '#132825',
              textMain: '#1C1917',   /* Deep charcoal font */
              textMuted: '#78716C',  /* Soft muted text */
              gold: '#D4A359',       /* Accent Gold */
              border: '#EFEAE2',     /* Warm border */
              /* Mosaic Tile Colors */
              mCream: '#FAF5E6',
              mPeach: '#E89872',
              mOlive: '#AA984A',
              mPlum: '#A36070',
              mLavender: '#988BAE',
              mMustard: '#C9A846',
              mBlue: '#6C98BC'
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #0b131b;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* MOSAIC ASSEMBLY ANIMATIONS FOR SPLASH SCREEN */
    @keyframes assembleP1 {
      0% { transform: translate(-80px, -80px) rotate(-35deg) scale(0.4); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes assembleP2 {
      0% { transform: translate(0px, -100px) rotate(20deg) scale(0.3); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes assembleP3 {
      0% { transform: translate(90px, -70px) rotate(45deg) scale(0.4); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes assembleP4 {
      0% { transform: scale(0.1) rotate(-180deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes assembleP5 {
      0% { transform: translate(-90px, 30px) rotate(-25deg) scale(0.4); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes assembleP6 {
      0% { transform: translate(-60px, 90px) rotate(15deg) scale(0.4); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes assembleP7 {
      0% { transform: translate(80px, 80px) rotate(-30deg) scale(0.4); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }

    .animate-p1 { animation: assembleP1 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p2 { animation: assembleP2 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p3 { animation: assembleP3 1.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p4 { animation: assembleP4 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p5 { animation: assembleP5 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p6 { animation: assembleP6 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p7 { animation: assembleP7 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* LIVING ORGANIC PULSE AFTER ASSEMBLY */
    @keyframes organicFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-6px) scale(1.02); }
    }
    .animate-mosaic-alive { animation: organicFloat 4s ease-in-out infinite 1.5s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    .animate-pulse-glow { animation: pulseGlow 3s ease-in-out infinite; }

    .glass-nav {
      background: rgba(250, 246, 238, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card-shadow {
      box-shadow: 0 4px 20px -2px rgba(90, 35, 48, 0.06), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen sm:p-4 font-sans text-mosiac-textMain antialiased">

  <!-- Mobile App Frame -->
  <div id="root" class="w-full max-w-md h-[100vh] sm:h-[870px] bg-mosiac-bg sm:rounded-[44px] shadow-2xl overflow-hidden relative border-0 sm:border-[8px] border-slate-800 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // MOCK DATA: EXPANDED & RICH
    // ==========================================
    const GENRES_LIST = [
      "Speculative Fiction", "A24 Cinema", "Ambient Soundscapes", 
      "Brutalist Architecture", "Post-Punk & New Wave", "Japanese Literature", 
      "Modernist Prose", "Independent Film Retrospectives", "80s Synth", "Conceptual Art"
    ];

    const INITIAL_LIBRARY_ITEMS = [
      { id: 'lib1', title: 'The Left Hand of Darkness', category: 'Book', creator: 'Ursula K. Le Guin', rating: '5.0', cover: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80', status: 'Reading', note: 'Essential speculative philosophy.' },
      { id: 'lib2', title: 'Aftersun', category: 'Film', creator: 'Charlotte Wells', rating: '4.9', cover: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400&q=80', status: 'Watched', note: 'Devastating memory study.' },
      { id: 'lib3', title: 'Remain in Light', category: 'Music', creator: 'Talking Heads', rating: '4.8', cover: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&q=80', status: 'Listening', note: 'Polyrhythmic masterpiece.' },
      { id: 'lib4', title: 'Norwegian Wood', category: 'Book', creator: 'Haruki Murakami', rating: '4.7', cover: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&q=80', status: 'Read', note: 'Quiet, melancholic Tokyo atmosphere.' },
      { id: 'lib5', title: 'Drive My Car', category: 'Film', creator: 'Ryusuke Hamaguchi', rating: '4.9', cover: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400&q=80', status: 'Watched', note: 'Grief and artistic catharsis.' },
      { id: 'lib6', title: 'Music for Airports', category: 'Music', creator: 'Brian Eno', rating: '5.0', cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&q=80', status: 'Listening', note: 'Soundtrack for quiet focus.' }
    ];

    const FRIENDS_SUGGESTED = [
      { id: 'u1', name: 'Julian Vance', handle: '@julianvance', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&q=80', source: 'Instagram' },
      { id: 'u2', name: 'Maya Lin', handle: '@mayalin_art', avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300&q=80', source: 'Contacts' },
      { id: 'u3', name: 'Marcus Chen', handle: '@marcus_c', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&q=80', source: 'Instagram' },
      { id: 'u4', name: 'Elena Rostova', handle: '@elena_design', avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=300&q=80', source: 'Facebook' }
    ];

    const FEED_POSTS = [
      {
        id: 'p1',
        user: 'Julian Vance',
        avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&q=80',
        time: '2h ago',
        type: 'Concert Log',
        title: 'David Byrne — Who I Am Tour',
        venue: 'Beacon Theatre, NY',
        image: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=800&q=80',
        note: 'Unbelievable staging. The choreography with barefoot untethered musicians and raw polyrhythmic percussion was completely transcendent.',
        loved: true
      },
      {
        id: 'p2',
        user: 'Maya Lin',
        avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300&q=80',
        time: '5h ago',
        type: 'Currently Reading',
        title: 'The Left Hand of Darkness',
        venue: 'Ursula K. Le Guin',
        image: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=800&q=80',
        note: 'Re-reading chapter 8 on the ice sheet. Le Guin’s world-building feels less like sci-fi and more like quiet philosophy.',
        loved: false
      },
      {
        id: 'p3',
        user: 'Marcus Chen',
        avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&q=80',
        time: '1d ago',
        type: 'Cinema Screening',
        title: 'In the Mood for Love (35mm)',
        venue: 'Metrograph Theater',
        image: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=800&q=80',
        note: 'The color grading on 35mm film stock hits completely differently.',
        loved: true
      }
    ];

    const CULTURAL_EVENTS = [
      {
        id: 'e1',
        title: 'David Byrne — Who I Am Live Tour',
        category: 'GIG / PERFORMANCE',
        date: 'FRI, OCT 14 • 8:00 PM',
        venue: 'Beacon Theatre, NY',
        image: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=800&q=80',
        description: 'An immersive live performance blending art-rock, polyrhythms, and untethered theatrical movement.',
        attendingFriends: [FRIENDS_SUGGESTED[0], FRIENDS_SUGGESTED[1]],
        matchScore: '96% Taste Match',
        price: '$65 - $120'
      },
      {
        id: 'e2',
        title: 'Wong Kar-wai 35mm Retrospective',
        category: 'CINEMA SCREENING',
        date: 'SUN, OCT 16 • 6:30 PM',
        venue: 'Metrograph Independent Cinema',
        image: 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=800&q=80',
        description: 'Restored 35mm print screening of "In the Mood for Love" followed by a panel on Hong Kong modern cinema aesthetics.',
        attendingFriends: [FRIENDS_SUGGESTED[2]],
        matchScore: '92% Taste Match',
        price: '$18'
      }
    ];

    const CURATORS = [
      { id: 'c1', name: 'Christopher Nolan', role: 'Filmmaker', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&q=80', quote: 'I look to speculative literature to understand structural pacing.' },
      { id: 'c2', name: 'Phoebe Bridgers', role: 'Songwriter & Musician', img: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300&q=80', quote: 'Movies that feel like quiet rooms on rainy afternoons.' },
      { id: 'c3', name: 'Zadie Smith', role: 'Author & Essayist', img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&q=80', quote: 'Cultural identity isn’t what you consume; it’s how deeply you feel it.' }
    ];

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [viewState, setViewState] = useState('splash'); // 'splash' | 'onboarding' | 'app'
      const [onboardStep, setOnboardStep] = useState(1);
      const [activeTab, setActiveTab] = useState('journal');
      
      // Modals
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [selectedItem, setSelectedItem] = useState(null);
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [selectedCurator, setSelectedCurator] = useState(null);
      const [activeMessageRecipient, setActiveMessageRecipient] = useState(null);
      
      // Data State
      const [userGenres, setUserGenres] = useState(['Speculative Fiction', 'A24 Cinema', 'Ambient Soundscapes']);
      const [libraryItems, setLibraryItems] = useState(INITIAL_LIBRARY_ITEMS);
      const [followedFriends, setFollowedFriends] = useState(['u1', 'u2']);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const handleAddContent = (newItem) => {
        setLibraryItems(prev => [newItem, ...prev]);
        setIsAddModalOpen(false);
      };

      return (
        <div className="flex flex-col h-full w-full bg-mosiac-bg text-mosiac-textMain relative overflow-hidden font-sans">
          
          {/* TOP STATUS BAR */}
          <div className="pt-3 px-6 flex justify-between items-center text-xs select-none z-30 font-medium text-mosiac-textMuted">
            <span className="font-mono text-[11px]">9:41</span>
            <div className="flex items-center space-x-2">
              <button 
                onClick={() => setViewState('splash')}
                className="text-[10px] font-mono uppercase bg-mosiac-plumLight text-mosiac-plum px-2.5 py-0.5 rounded-full font-semibold border border-mosiac-plum/20"
              >
                Replay Splash
              </button>
            </div>
          </div>

          {/* MAIN CONTAINER */}
          <main className="flex-1 overflow-y-auto no-scrollbar relative flex flex-col">
            
            {/* 1. VISUAL SPLASH SCREEN */}
            {viewState === 'splash' && (
              <SplashScreen onStart={() => setViewState('onboarding')} />
            )}

            {/* 2. ONBOARDING FLOW */}
            {viewState === 'onboarding' && (
              <OnboardingFlow 
                step={onboardStep}
                setStep={setOnboardStep}
                genres={userGenres}
                toggleGenre={(g) => setUserGenres(prev => prev.includes(g) ? prev.filter(x => x !== g) : [...prev, g])}
                followed={followedFriends}
                toggleFollow={(id) => setFollowedFriends(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id])}
                onFinish={() => setViewState('app')}
              />
            )}

            {/* 3. MAIN APP HOMEPAGE & TABS */}
            {viewState === 'app' && (
              <>
                {activeTab === 'journal' && (
                  <JournalView 
                    onSelectItem={setSelectedItem} 
                    onSelectCurator={setSelectedCurator}
                    onSelectEvent={setSelectedEvent}
                    onOpenAdd={() => setIsAddModalOpen(true)}
                  />
                )}
                {activeTab === 'feed' && (
                  <FeedView 
                    posts={FEED_POSTS} 
                    onSelectItem={setSelectedItem}
                    onSendMessage={(user) => setActiveMessageRecipient(user)} 
                  />
                )}
                {activeTab === 'events' && (
                  <EventsView events={CULTURAL_EVENTS} onSelectEvent={setSelectedEvent} />
                )}
                {activeTab === 'taste' && (
                  <TasteDNAView genres={userGenres} onSelectCurator={setSelectedCurator} />
                )}
                {activeTab === 'library' && (
                  <LibraryView libraryItems={libraryItems} onSelectItem={setSelectedItem} />
                )}
              </>
            )}

          </main>

          {/* EDITORIAL BOTTOM NAVIGATION WITH CENTRAL '+' ACTION BUTTON */}
          {viewState === 'app' && !selectedItem && !selectedEvent && !selectedCurator && !activeMessageRecipient && (
            <nav className="glass-nav border-t border-mosiac-border px-3 py-2 flex justify-around items-center z-40 relative">
              
              {/* Tab 1: Journal */}
              <button
                onClick={() => setActiveTab('journal')}
                className={`flex flex-col items-center py-1 px-2.5 rounded-2xl transition-all ${
                  activeTab === 'journal' ? 'text-mosiac-plum font-semibold scale-105' : 'text-mosiac-textMuted'
                }`}
              >
                <i data-lucide="book-open" className="w-5 h-5 mb-0.5"></i>
                <span className="text-[10px] tracking-tight">Journal</span>
              </button>

              {/* Tab 2: Feed */}
              <button
                onClick={() => setActiveTab('feed')}
                className={`flex flex-col items-center py-1 px-2.5 rounded-2xl transition-all ${
                  activeTab === 'feed' ? 'text-mosiac-plum font-semibold scale-105' : 'text-mosiac-textMuted'
                }`}
              >
                <i data-lucide="users" className="w-5 h-5 mb-0.5"></i>
                <span className="text-[10px] tracking-tight">Feed</span>
              </button>

              {/* CENTRAL ELEVATED PLUS BUTTON (Instagram / Letterboxd Cues) */}
              <div className="relative -top-3">
                <button
                  onClick={() => setIsAddModalOpen(true)}
                  className="w-12 h-12 rounded-full bg-mosiac-plum text-mosiac-bg flex items-center justify-center shadow-lg shadow-mosiac-plum/30 border-2 border-mosiac-bg active:scale-95 transition-transform"
                >
                  <i data-lucide="plus" className="w-6 h-6 stroke-[2.5]"></i>
                </button>
              </div>

              {/* Tab 3: Taste */}
              <button
                onClick={() => setActiveTab('taste')}
                className={`flex flex-col items-center py-1 px-2.5 rounded-2xl transition-all ${
                  activeTab === 'taste' ? 'text-mosiac-plum font-semibold scale-105' : 'text-mosiac-textMuted'
                }`}
              >
                <i data-lucide="compass" className="w-5 h-5 mb-0.5"></i>
                <span className="text-[10px] tracking-tight">Taste</span>
              </button>

              {/* Tab 4: Library */}
              <button
                onClick={() => setActiveTab('library')}
                className={`flex flex-col items-center py-1 px-2.5 rounded-2xl transition-all ${
                  activeTab === 'library' ? 'text-mosiac-plum font-semibold scale-105' : 'text-mosiac-textMuted'
                }`}
              >
                <i data-lucide="bookmark" className="w-5 h-5 mb-0.5"></i>
                <span className="text-[10px] tracking-tight">Library</span>
              </button>

            </nav>
          )}

          {/* INTERACTIVE ADD CONTENT MODAL */}
          {isAddModalOpen && (
            <AddContentModal 
              onClose={() => setIsAddModalOpen(false)} 
              onAdd={handleAddContent} 
            />
          )}

          {/* DEEP INTERACTIVE DRAWER SHEETS & MODALS */}
          {selectedItem && (
            <ItemDetailModal item={selectedItem} onClose={() => setSelectedItem(null)} />
          )}

          {selectedEvent && (
            <EventDetailModal event={selectedEvent} onClose={() => setSelectedEvent(null)} />
          )}

          {selectedCurator && (
            <CuratorDetailModal curator={selectedCurator} onClose={() => setSelectedCurator(null)} />
          )}

          {activeMessageRecipient && (
            <MessageModal recipient={activeMessageRecipient} onClose={() => setActiveMessageRecipient(null)} />
          )}

        </div>
      );
    }

    // ==========================================
    // SPLASH SCREEN
    // ==========================================
    function SplashScreen({ onStart }) {
      return (
        <div className="absolute inset-0 z-50 bg-mosiac-teal text-mosiac-mCream flex flex-col justify-between p-8 select-none animate-slide-up overflow-hidden">
          
          <div className="pt-4 text-center">
            <div className="text-[10px] font-mono uppercase tracking-[0.25em] text-mosiac-mCream/60 font-bold">
              The Vibe Matcher
            </div>
          </div>

          <div className="my-auto flex flex-col items-center justify-center space-y-8">
            <div className="relative w-44 h-44 flex items-center justify-center animate-mosaic-alive cursor-pointer" onClick={onStart}>
              <svg width="170" height="170" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path className="animate-p1" d="M 35 25 C 55 15, 80 15, 95 30 L 78 82 L 20 85 C 15 60, 20 40, 35 25 Z" fill="#FAF5E6" />
                <path className="animate-p2" d="M 102 30 C 120 18, 145 18, 165 30 L 132 82 L 85 82 Z" fill="#E89872" />
                <path className="animate-p3" d="M 172 35 C 185 55, 185 75, 175 100 L 125 105 L 138 82 Z" fill="#AA984A" />
                <path className="animate-p4" d="M 85 88 L 128 88 L 120 138 L 82 135 Z" fill="#A36070" />
                <path className="animate-p5" d="M 18 92 L 75 88 L 78 132 L 25 125 Z" fill="#988BAE" />
                <path className="animate-p6" d="M 28 132 L 78 138 L 75 170 C 50 175, 30 160, 28 132 Z" fill="#C9A846" />
                <path className="animate-p7" d="M 85 142 L 122 142 L 175 108 C 185 135, 165 170, 125 172 Z" fill="#6C98BC" />
              </svg>
            </div>

            <div className="text-center space-y-2">
              <h1 className="text-3xl font-serif tracking-[0.25em] font-extrabold uppercase text-mosiac-mCream">
                MOSIAC
              </h1>
              <p className="text-xs font-serif italic text-mosiac-mCream/80 max-w-xs leading-relaxed px-4">
                "Where books, films, vinyl, and gigs come together into a single living mosaic."
              </p>
            </div>
          </div>

          <div className="pb-6 space-y-3">
            <button
              onClick={onStart}
              className="w-full py-4 rounded-2xl bg-mosiac-mCream text-mosiac-teal font-bold text-xs tracking-wider uppercase shadow-2xl flex items-center justify-center space-x-2 active:scale-95 transition-transform"
            >
              <span>Explore Your Cultural Mosaic</span>
              <i data-lucide="arrow-right" className="w-4 h-4 text-mosiac-teal"></i>
            </button>
          </div>

        </div>
      );
    }

    // ==========================================
    // ONBOARDING FLOW
    // ==========================================
    function OnboardingFlow({ step, setStep, genres, toggleGenre, followed, toggleFollow, onFinish }) {
      return (
        <div className="flex-1 flex flex-col justify-between p-6 animate-slide-up bg-mosiac-bg">
          
          <div className="space-y-4">
            <div className="flex justify-between items-center text-[10px] font-mono text-mosiac-textMuted uppercase tracking-widest">
              <span>Step {step} of 2</span>
              <button onClick={onFinish} className="hover:text-mosiac-plum font-bold">Skip</button>
            </div>
            
            <div className="w-full bg-mosiac-border h-1 rounded-full overflow-hidden">
              <div className="bg-mosiac-plum h-full transition-all duration-300" style={{ width: `${(step/2)*100}%` }}></div>
            </div>
          </div>

          {step === 1 && (
            <div className="space-y-5 my-auto">
              <div>
                <h2 className="text-2xl font-serif font-bold">What shapes your taste?</h2>
                <p className="text-xs text-mosiac-textMuted mt-1">Select entry points to seed your taste blueprint.</p>

                <i data-lucide="chevron-right" className="w-4 h-4 text-mosiac-textMuted"></i>
              </div>

              <div className="p-3.5 bg-mosiac-card rounded-2xl border border-mosiac-border card-shadow flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-800 flex items-center justify-center text-base font-bold">✈️</div>
                  <div>
                    <h5 className="text-xs font-serif font-bold">Tokyo Travel Inspo</h5>
                    <p className="text-[10px] text-mosiac-textMuted">14 jazz kissa bars & bookstores</p>
                  </div>
                </div>
                <i data-lucide="chevron-right" className="w-4 h-4 text-mosiac-textMuted"></i>
              </div>
            </div>
          </div>

          {/* Memory Lane Card */}
          <div className="p-4 rounded-2xl bg-gradient-to-r from-mosiac-plumLight to-amber-50 border border-mosiac-plum/20 space-y-1">
            <div className="flex items-center space-x-1.5 text-mosiac-plum">
              <i data-lucide="calendar" className="w-3.5 h-3.5"></i>
              <span className="text-[10px] font-mono font-bold uppercase tracking-wider">This Time Last Year</span>
            </div>
            <p className="text-xs font-serif text-mosiac-textMain pt-0.5">
              In July 2025, your top vibe was <b>90s Hip-Hop & Natural Wine Small Plates</b>.
            </p>
          </div>

        </div>
      );
    }

    // ==========================================
    // INSTAGRAM / LETTERBOXD-STYLE ADD CONTENT MODAL
    // ==========================================
    function AddContentModal({ onClose, onAdd }) {
      const [mediaType, setMediaType] = useState('Film'); // Film, Book, Music, Event
      const [title, setTitle] = useState('');
      const [creator, setCreator] = useState('');
      const [rating, setRating] = useState('5.0');
      const [note, setNote] = useState('');

      const handleSave = () => {
        if (!title) return;
        const newItem = {
          id: 'item_' + Date.now(),
          title,
          category: mediaType,
          creator: creator || 'User Log',
          rating,
          status: 'Logged',
          cover: mediaType === 'Film' 
            ? 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400&q=80'
            : mediaType === 'Book'
            ? 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80'
            : 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&q=80',
          note
        };
        onAdd(newItem);
      };

      return (
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center animate-slide-up">
          <div className="bg-mosiac-bg w-full rounded-t-3xl p-6 space-y-5 border-t border-mosiac-plum/30 max-h-[90vh] overflow-y-auto">
            
            <div className="flex justify-between items-center">
              <span className="text-[10px] font-mono uppercase text-mosiac-plum font-bold tracking-widest">LOG TO YOUR MOSIAC</span>
              <button onClick={onClose} className="p-1 text-mosiac-textMuted hover:text-mosiac-textMain">
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>
            </div>

            {/* Media Picker Selector */}
            <div className="grid grid-cols-4 gap-1.5 p-1 bg-mosiac-card rounded-2xl border border-mosiac-border">
              {['Film', 'Book', 'Music', 'Event'].map(type => (
                <button
                  key={type}
                  onClick={() => setMediaType(type)}
                  className={`py-2 text-xs font-bold rounded-xl transition ${
                    mediaType === type 
                      ? 'bg-mosiac-plum text-mosiac-bg shadow-sm' 
                      : 'text-mosiac-textMuted hover:text-mosiac-textMain'
                  }`}
                >
                  {type}
                </button>
              ))}
            </div>

            {/* Input Form */}
            <div className="space-y-3">
              <div>
                <label className="text-[10px] font-mono uppercase text-mosiac-textMuted font-bold">Title</label>
                <input 
                  type="text" 
                  value={title}
                  onChange={(e) => setTitle(e.target.value)}
                  placeholder={`Search or type ${mediaType.toLowerCase()} title...`}
                  className="w-full mt-1 px-4 py-3 rounded-2xl bg-white border border-mosiac-border text-xs focus:outline-none focus:border-mosiac-plum"
                />
              </div>

              <div>
                <label className="text-[10px] font-mono uppercase text-mosiac-textMuted font-bold">Creator / Author / Artist</label>
                <input 
                  type="text" 
                  value={creator}
                  onChange={(e) => setCreator(e.target.value)}
                  placeholder="e.g. Director, Author, or Venue..."
                  className="w-full mt-1 px-4 py-3 rounded-2xl bg-white border border-mosiac-border text-xs focus:outline-none focus:border-mosiac-plum"
                />
              </div>

              <div>
                <label className="text-[10px] font-mono uppercase text-mosiac-textMuted font-bold">Your Reaction / Notes</label>
                <textarea 
                  value={note}
                  onChange={(e) => setNote(e.target.value)}
                  placeholder="Write a quick thought, quote, or review..."
                  className="w-full mt-1 h-20 p-3 rounded-2xl bg-white border border-mosiac-border text-xs focus:outline-none focus:border-mosiac-plum"
                />
              </div>
            </div>

            <button 
              onClick={handleSave}
              className="w-full py-4 bg-mosiac-plum text-mosiac-bg text-xs font-bold uppercase tracking-wider rounded-2xl shadow-lg active:scale-98 transition"
            >
              Add to Library & Journal
            </button>

          </div>
        </div>
      );
    }

    // ==========================================
    // DETAIL MODALS
    // ==========================================
    function ItemDetailModal({ item, onClose }) {
      return (
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center animate-slide-up">
          <div className="bg-mosiac-bg w-full rounded-t-3xl p-6 space-y-5 border-t border-mosiac-plum/30 max-h-[85vh] overflow-y-auto">
            <div className="flex justify-between items-center">
              <span className="text-[10px] font-mono uppercase text-mosiac-plum font-bold">{item.category || 'Cultural Anchor'}</span>
              <button onClick={onClose} className="p-1"><i data-lucide="x" className="w-5 h-5 text-mosiac-textMuted"></i></button>
            </div>

            <img src={item.cover || item.image} className="w-36 h-48 rounded-2xl object-cover mx-auto shadow-xl" />

            <div className="text-center space-y-1">
              <h2 className="text-2xl font-serif font-bold">{item.title}</h2>
              <div className="text-xs text-mosiac-textMuted">{item.creator || item.venue}</div>
            </div>

            <p className="text-xs font-serif italic text-center text-mosiac-textMain p-3 bg-white rounded-2xl border border-mosiac-border">
              "{item.note || 'Selected as a cornerstone recommendation.'}"
            </p>

            <button onClick={onClose} className="w-full py-3.5 bg-mosiac-plum text-mosiac-bg text-xs font-bold rounded-2xl shadow-lg">
              Close
            </button>
          </div>
        </div>
      );
    }

    function EventDetailModal({ event, onClose }) {
      return (
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center animate-slide-up">
          <div className="bg-mosiac-bg w-full rounded-t-3xl p-6 space-y-5 border-t border-mosiac-plum/30 max-h-[85vh] overflow-y-auto">
            <div className="flex justify-between items-center">
              <span className="text-[10px] font-mono uppercase text-mosiac-gold font-bold">{event.category}</span>
              <button onClick={onClose} className="p-1"><i data-lucide="x" className="w-5 h-5 text-mosiac-textMuted"></i></button>
            </div>

            <img src={event.image} className="w-full h-44 rounded-2xl object-cover shadow-lg" />

            <div className="space-y-1">
              <div className="text-[10px] font-mono text-mosiac-plum font-bold">{event.date}</div>
              <h2 className="text-xl font-serif font-bold">{event.title}</h2>
              <div className="text-xs text-mosiac-textMuted">{event.venue} • {event.price}</div>
            </div>

            <button onClick={onClose} className="w-full py-3.5 bg-mosiac-plum text-mosiac-bg text-xs font-bold rounded-2xl shadow-lg">
              RSVP & Close
            </button>
          </div>
        </div>
      );
    }

    function CuratorDetailModal({ curator, onClose }) {
      return (
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center animate-slide-up">
          <div className="bg-mosiac-bg w-full rounded-t-3xl p-6 space-y-5 border-t border-mosiac-plum/30 max-h-[85vh] overflow-y-auto">
            <div className="flex justify-between items-center">
              <span className="text-[10px] font-mono uppercase text-mosiac-plum font-bold">Tastemaker Profile</span>
              <button onClick={onClose} className="p-1"><i data-lucide="x" className="w-5 h-5 text-mosiac-textMuted"></i></button>
            </div>

            <img src={curator.img} className="w-20 h-20 rounded-full object-cover mx-auto shadow-md" />

            <div className="text-center space-y-1">
              <h2 className="text-xl font-serif font-bold">{curator.name}</h2>
              <div className="text-xs text-mosiac-textMuted">{curator.role}</div>
            </div>

            <p className="text-xs font-serif italic text-center text-mosiac-textMain p-3 bg-white rounded-2xl border border-mosiac-border">
              "{curator.quote}"
            </p>

            <button onClick={onClose} className="w-full py-3 bg-mosiac-plum text-mosiac-bg text-xs font-bold rounded-2xl">
              Follow Taste Curation
            </button>
          </div>
        </div>
      );
    }

    function MessageModal({ recipient, onClose }) {
      const [sent, setSent] = useState(false);

      return (
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center animate-slide-up">
          <div className="bg-mosiac-bg w-full rounded-t-3xl p-6 space-y-4 border-t border-mosiac-plum/30">
            <div className="flex justify-between items-center">
              <h3 className="text-xs font-serif font-bold">Message {recipient}</h3>
              <button onClick={onClose} className="p-1"><i data-lucide="x" className="w-5 h-5 text-mosiac-textMuted"></i></button>
            </div>

            {sent ? (
              <div className="p-6 text-center space-y-2">
                <div className="text-sm font-serif font-bold">Note Sent!</div>
                <button onClick={onClose} className="py-2 px-4 bg-mosiac-plum text-white text-xs rounded-xl">Close</button>
              </div>
            ) : (
              <div className="space-y-3">
                <textarea 
                  placeholder={`Send a thought to ${recipient}...`}
                  className="w-full h-24 p-3 rounded-2xl bg-white border border-mosiac-border text-xs focus:outline-none focus:border-mosiac-plum"
                />
                <button onClick={() => setSent(true)} className="w-full py-3 bg-mosiac-plum text-mosiac-bg text-xs font-bold rounded-2xl">
                  Send Note
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
