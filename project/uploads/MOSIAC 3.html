      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            mosiac: {

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #0b131b;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* MOSAIC ASSEMBLY ANIMATIONS FOR SPLASH SCREEN */
    @keyframes assembleP1 {
      0% { transform: translate(-80px, -80px) rotate(-35deg) scale(0.4); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes assembleP2 {
      0% { transform: translate(0px, -100px) rotate(20deg) scale(0.3); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes assembleP3 {
      0% { transform: translate(90px, -70px) rotate(45deg) scale(0.4); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes assembleP4 {
      0% { transform: scale(0.1) rotate(-180deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes assembleP5 {
      0% { transform: translate(-90px, 30px) rotate(-25deg) scale(0.4); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes assembleP6 {
      0% { transform: translate(-60px, 90px) rotate(15deg) scale(0.4); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }
    @keyframes assembleP7 {
      0% { transform: translate(80px, 80px) rotate(-30deg) scale(0.4); opacity: 0; }
      100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    }

    .animate-p1 { animation: assembleP1 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p2 { animation: assembleP2 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p3 { animation: assembleP3 1.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p4 { animation: assembleP4 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p5 { animation: assembleP5 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p6 { animation: assembleP6 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-p7 { animation: assembleP7 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* LIVING ORGANIC PULSE AFTER ASSEMBLY */
    @keyframes organicFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }
    .animate-mosaic-alive { animation: organicFloat 4s ease-in-out infinite 1.5s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .glass-nav {
      background: rgba(250, 246, 238, 0.94);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .card-shadow {
      box-shadow: 0 4px 20px -2px rgba(90, 35, 48, 0.06), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
    }
  </style>
</head>

    // ==========================================
    // MAIN APP COMPONENT

                step={onboardStep}
                setStep={setOnboardStep}
                genres={userGenres}
                toggleGenre={(g) => setUserGenres(prev => prev.includes(g) ? prev.filter(x => x !== g) : [...prev, g])}
                favorites={userFavorites}
                addFavorite={(f) => setUserFavorites(prev => [...prev, f])}
                followed={followedFriends}
                toggleFollow={(id) => setFollowedFriends(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id])}
                onFinish={() => setViewState('app')}
              />
            )}

              <>
                {activeTab === 'journal' && (
                  <JournalView 
                    onSelectItem={setSelectedItem} 
                    onSelectCurator={setSelectedCurator}
                    onSelectEvent={setSelectedEvent}
                  />

                {activeTab === 'feed' && (

                    posts={FEED_POSTS} 
                    onSelectItem={setSelectedItem}
                    onSendMessage={(user) => setActiveMessageRecipient(user)}

                )}

                )}
                {activeTab === 'taste' && (
                  <TasteDNAView genres={userGenres} favorites={userFavorites} onSelectCurator={setSelectedCurator} />

    // ==========================================
    // 2. ONBOARDING FLOW
    // ==========================================
    function OnboardingFlow({ step, setStep, genres, toggleGenre, favorites, addFavorite, followed, toggleFollow, onFinish }) {
      const [customInput, setCustomInput] = useState('');

      return (
        <div className="flex-1 flex flex-col justify-between p-6 animate-slide-up bg-mosiac-bg">
          
          <div className="space-y-4">
            <div className="flex justify-between items-center text-[10px] font-mono text-mosiac-textMuted uppercase tracking-widest">
              <span>Step {step} of 3</span>
              <button onClick={onFinish} className="hover:text-mosiac-plum font-bold">Skip Onboarding</button>
            </div>
            
            <div className="w-full bg-mosiac-border h-1 rounded-full overflow-hidden">
              <div className="bg-mosiac-plum h-full transition-all duration-300" style={{ width: `${(step/3)*100}%` }}></div>
            </div>
          </div>

          {/* STEP 1: SELECT TASTE PILLARS */}
          {step === 1 && (
            <div className="space-y-5 my-auto">

                  </div>
                  <div className="w-full bg-mosiac-bg h-2 rounded-full overflow-hidden">
                    <div className="bg-mosiac-plum h-full rounded-full" style={{ width: `${90 - i * 7}%` }}></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. LIBRARY TAB
    // ==========================================
    function LibraryView({ favorites, onSelectItem }) {
      return (
        <div className="p-5 space-y-6 pb-12 animate-slide-up">
          <div>
            <div className="text-[10px] font-mono uppercase tracking-widest text-mosiac-textMuted font-bold">
              PERSONAL ARCHIVE
            </div>
            <h1 className="text-2xl font-serif font-bold mt-0.5">Saved Cultural Library</h1>
          </div>

          <div className="grid grid-cols-2 gap-3">
            {favorites.map((fav, i) => (
              <div 
                key={i} 
                onClick={() => onSelectItem({ title: fav, category: 'Saved Item', creator: 'Personal Archive', note: 'Saved to your personal cultural library.' })}
                className="p-4 bg-mosiac-card rounded-2xl border border-mosiac-border card-shadow space-y-2 cursor-pointer hover:border-mosiac-plum/40 transition"
              >
                <i data-lucide="bookmark" className="w-4 h-4 text-mosiac-plum"></i>
                <div className="text-xs font-serif font-bold">{fav}</div>
                <div className="text-[10px] text-mosiac-textMuted">Saved Anchor</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // DEEP INTERACTIVE MODALS
    // ==========================================
    function ItemDetailModal({ item, onClose }) {
      return (
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center animate-slide-up">
          <div className="bg-mosiac-bg w-full rounded-t-3xl p-6 space-y-5 border-t border-mosiac-plum/30 max-h-[85vh] overflow-y-auto">
            <div className="flex justify-between items-center">
              <span className="text-[10px] font-mono uppercase text-mosiac-plum font-bold">{item.category || 'Cultural Anchor'}</span>
              <button onClick={onClose} className="p-1"><i data-lucide="x" className="w-5 h-5 text-mosiac-textMuted"></i></button>
            </div>

            <img src={item.cover || item.image} className="w-36 h-48 rounded-2xl object-cover mx-auto shadow-xl" />

            <div className="text-center space-y-1">
              <h2 className="text-2xl font-serif font-bold">{item.title}</h2>
              <div className="text-xs text-mosiac-textMuted">{item.creator || item.venue}</div>
            </div>

            {item.curatorNote && (
              <div className="p-3 bg-mosiac-plumLight rounded-2xl text-[11px] text-mosiac-plum font-serif italic text-center">
                "{item.curatorNote}"
              </div>
            )}

            <p className="text-xs font-serif italic text-center text-mosiac-textMain p-3 bg-white rounded-2xl border border-mosiac-border">
              "{item.note || 'Selected as a cornerstone recommendation based on your Taste DNA alignment.'}"
            </p>

            {item.tracklist && (
              <div className="space-y-1.5 pt-1">
                <div className="text-[10px] font-mono uppercase text-mosiac-textMuted">Key Tracks / Chapters</div>
                <div className="space-y-1">
                  {item.tracklist.map((t, i) => (
                    <div key={i} className="p-2 bg-white rounded-xl text-xs font-serif border border-mosiac-border flex justify-between">
                      <span>{t}</span>
                      <i data-lucide="play" className="w-3 h-3 text-mosiac-plum"></i>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="grid grid-cols-2 gap-2 pt-2">
              <button className="py-3 bg-mosiac-plum text-mosiac-bg text-xs font-bold rounded-2xl">
                Add to My Library
              </button>
              <button className="py-3 bg-white text-mosiac-plum border border-mosiac-border text-xs font-bold rounded-2xl">
                Share with Friend
              </button>
            </div>
          </div>
        </div>
      );
    }

    function EventDetailModal({ event, onClose }) {
      return (
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center animate-slide-up">
          <div className="bg-mosiac-bg w-full rounded-t-3xl p-6 space-y-5 border-t border-mosiac-plum/30 max-h-[85vh] overflow-y-auto">
            <div className="flex justify-between items-center">
              <span className="text-[10px] font-mono uppercase text-mosiac-gold font-bold">{event.category}</span>
              <button onClick={onClose} className="p-1"><i data-lucide="x" className="w-5 h-5 text-mosiac-textMuted"></i></button>
            </div>

            <img src={event.image} className="w-full h-44 rounded-2xl object-cover shadow-lg" />

            <div className="space-y-1">
              <div className="text-[10px] font-mono text-mosiac-plum font-bold">{event.date}</div>
              <h2 className="text-xl font-serif font-bold">{event.title}</h2>
              <div className="text-xs text-mosiac-textMuted">{event.venue} • {event.price}</div>
            </div>

            <p className="text-xs font-serif text-mosiac-textMain leading-relaxed">
              {event.description}
            </p>

            <button className="w-full py-3.5 bg-mosiac-plum text-mosiac-bg text-xs font-bold rounded-2xl shadow-lg">
              Get Tickets & RSVP ({event.price})
            </button>
          </div>
        </div>
      );
    }

    function CuratorDetailModal({ curator, onClose }) {
      return (
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center animate-slide-up">
          <div className="bg-mosiac-bg w-full rounded-t-3xl p-6 space-y-5 border-t border-mosiac-plum/30 max-h-[85vh] overflow-y-auto">
            <div className="flex justify-between items-center">
              <span className="text-[10px] font-mono uppercase text-mosiac-plum font-bold">Tastemaker Profile</span>
              <button onClick={onClose} className="p-1"><i data-lucide="x" className="w-5 h-5 text-mosiac-textMuted"></i></button>
            </div>

            <img src={curator.img} className="w-20 h-20 rounded-full object-cover mx-auto shadow-md" />

            <div className="text-center space-y-1">
              <h2 className="text-xl font-serif font-bold">{curator.name}</h2>
              <div className="text-xs text-mosiac-textMuted">{curator.role}</div>
            </div>

            <p className="text-xs font-serif italic text-center text-mosiac-textMain p-3 bg-white rounded-2xl border border-mosiac-border">
              "{curator.quote}"
            </p>

            <button className="w-full py-3 bg-mosiac-plum text-mosiac-bg text-xs font-bold rounded-2xl">
              Follow Taste Curation
            </button>
          </div>
        </div>
      );
    }

    function MessageModal({ recipient, onClose }) {
      const [msg, setMsg] = useState('');
      const [sent, setSent] = useState(false);

      return (
        <div className="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end justify-center animate-slide-up">
          <div className="bg-mosiac-bg w-full rounded-t-3xl p-6 space-y-4 border-t border-mosiac-plum/30">
            <div className="flex justify-between items-center">
              <h3 className="text-xs font-serif font-bold">Message {recipient}</h3>
              <button onClick={onClose} className="p-1"><i data-lucide="x" className="w-5 h-5 text-mosiac-textMuted"></i></button>
            </div>

            {sent ? (
              <div className="p-6 text-center space-y-2">
                <i data-lucide="check-circle" className="w-8 h-8 text-mosiac-plum mx-auto"></i>
                <div className="text-sm font-serif font-bold">Note Sent!</div>
                <p className="text-xs text-mosiac-textMuted">Your message has been sent to {recipient}.</p>
              </div>
            ) : (
              <div className="space-y-3">
                <textarea 
                  value={msg}
                  onChange={(e) => setMsg(e.target.value)}
                  placeholder={`Send a thought or note to ${recipient}...`}
                  className="w-full h-24 p-3 rounded-2xl bg-white border border-mosiac-border text-xs focus:outline-none focus:border-mosiac-plum"
                />
                <button 
                  onClick={() => setSent(true)}
                  className="w-full py-3 bg-mosiac-plum text-mosiac-bg text-xs font-bold rounded-2xl"
                >
                  Send Note
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
